[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wanxi-geo-agent"
version = "0.1.0"
description = "Local GEO multi-agent demo for WANXI Project 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
wanxi-geo = "wanxi_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wanxi_geo = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
